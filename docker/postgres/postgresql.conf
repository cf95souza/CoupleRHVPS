# ==============================================================================
# CoupleRH Enterprise — PostgreSQL 17 Configuration (VPS Oracle Cloud ARM64)
# Hardware Alvo: VM.Standard.A1.Flex (4 OCPU Ampere A1, 24 GB RAM, 200 GB SSD NVMe)
# Fuso Horário Legal: America/Sao_Paulo (Portaria MTP 671/2021)
# ==============================================================================

# Conexões e Rede
listen_addresses = '*'
max_connections = 150
superuser_reserved_connections = 3

# Memória e Cache (Compatível com Docker Desktop Local e VPS ARM64)
# Em produção VPS Oracle ARM64 (24 GB RAM), recomenda-se ajustar para:
#   shared_buffers = 6GB
#   effective_cache_size = 18GB
#   maintenance_work_mem = 1536MB
#   work_mem = 40MB
shared_buffers = 1GB
effective_cache_size = 3GB
maintenance_work_mem = 256MB
work_mem = 16MB

# Otimizações de I/O e Armazenamento (SSD NVMe OCI)
random_page_cost = 1.1                # Custos próximos a leitura sequencial em NVMe
effective_io_concurrency = 200        # Número de operações de I/O concorrentes suportadas
checkpoint_completion_target = 0.9    # Espalha I/O de checkpoints uniformemente no tempo
wal_buffers = 16MB                    # 16 MB para buffer de log de transação
min_wal_size = 2GB
max_wal_size = 8GB

# Paralelismo em CPU ARM64 (4 OCPU)
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Planejador e Estatísticas
default_statistics_target = 100

# Locale, Moeda e Fuso Horário (compatível com musl/postgres:17-alpine)
timezone = 'America/Sao_Paulo'
log_timezone = 'America/Sao_Paulo'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Logs e Auditoria do Banco
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_statement = 'ddl'
log_temp_files = 0
